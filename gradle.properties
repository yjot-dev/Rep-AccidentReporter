# Obliga al proyecto a usar librerías AndroidX en lugar de Support Libraries
android.useAndroidX=true

# Define el estilo oficial de Kotlin (convenciones de código)
kotlin.code.style=official

# Hace que las clases R no sean transitivas, mejora tiempos de compilación en proyectos grandes
android.nonTransitiveRClass=true

# Activa el cache de configuración de Gradle para acelerar builds repetidos
org.gradle.configuration-cache=true

# Suprime advertencias al usar un compileSdk no oficialmente soportado
android.suppressUnsupportedCompileSdk=35